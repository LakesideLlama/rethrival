<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>ReThrival</title>
</head><body>

<canvas id="c"></canvas>
<canvas id="star-c"></canvas>

<div id="hud">
  <div class="hud-box" id="lvl-box">Lv 1</div>
  <div class="hud-box" id="gold-box">🪙 0</div>
  <div class="hud-box" style="padding:4px 8px"><div id="xpbar-bg"><div id="xpbar-fill" style="width:0%"></div></div></div>
  <div class="hud-box" id="zoom-box" style="color:#777;font-size:11px">100%</div>
  <div class="hud-box" id="rp-box" style="color:#f0c040;cursor:pointer" onclick="openResearch()" title="Research Points — press R">✦ 0</div>
  <div class="hud-box" id="persp-box" style="color:#aad4ff;cursor:pointer" onclick="togglePerspective()" title="Toggle perspective — press P">2D</div>
</div>

<div id="inv-sidebar">
  <h3>Inventory</h3>
  <div id="inv-list"><div style="color:#555;font-size:11px">empty</div></div>
</div>

<div id="toolbar">
  <button class="tool-btn" id="btn-build" onclick="toggleBuildMenu()">Build</button>
  <button class="tool-btn" id="btn-research" onclick="openResearch()">Research</button>
</div>

<div id="build-menu">
  <div id="build-items"></div>
</div>

<button id="settings-btn" onclick="toggleSettings()">Settings</button>
<div id="settings-panel">
  <h3>Settings</h3>
  <div class="setting-row"><span>Zoom</span><span id="s-zoom">100%</span></div>
  <div class="setting-row"><span>Player speed</span>
    <select id="s-speed" style="background:#1e2a44;border:1px solid #445;border-radius:4px;color:#ccd;font-size:11px;font-family:monospace;padding:2px 6px">
      <option value="80">Slow</option><option value="120" selected>Normal</option><option value="180">Fast</option>
    </select>
  </div>
  <div class="setting-row"><span>Show FPS</span><button onclick="toggleFPS()"><span id="fps-lbl">Off</span></button></div>
  <div class="setting-row"><span>Save game</span><button onclick="saveGameManual()">Save</button></div>
  <div class="setting-row"><span>Load game</span><button onclick="loadGame(true)">Load</button></div>
  <div class="setting-row"><span>Reset world</span><button onclick="confirmReset()">Reset</button></div>
</div>

<div id="workbench-ui">
  <div id="workbench-overlay" onclick="closeWorkbench()"></div>
  <div id="workbench-panel">
    <div id="wb-header">
      <h2>⚒ Workbench</h2>
      <button id="wb-close" onclick="closeWorkbench()">✕</button>
    </div>
    <div id="wb-recipes"></div>
  </div>
</div>

<div id="research-ui">
  <div id="research-overlay"></div>
</div>

<div id="msg"></div>

<script type="module" src="/src/main.js"></script>
</body></html>
